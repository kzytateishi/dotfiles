#################################
# Prefix
#################################
unbind C-b
set -g prefix C-a
bind C-a send-prefix

#################################
# General
#################################
set -g default-terminal tmux-256color
# 3.2+ の書き方。terminal-overrides の Tc は旧式
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
# OSC 8 のハイパーリンク (Claude Code / ls --hyperlink) と undercurl (nvim の診断の波線) を外側へ通す
set -as terminal-features ",xterm*:hyperlinks:usstyle"
# Shift+Enter など修飾キー付きの入力を区別して内側へ渡す
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"
# 内側のプログラムが出す OSC シーケンス (Claude Code の通知・進捗バーなど) を外側の端末へ通す
set -g allow-passthrough on

# window title
set -g set-titles on
# iTerm2 のタブ名。セッション名:今のディレクトリ名 (例: styler:api)
set -g set-titles-string "#S:#{b:pane_current_path}"
set -g allow-rename off
# ウィンドウ名はカレントディレクトリ名。prefix + A でリネームしたウィンドウは自動更新が止まる
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

set -g base-index 1
set -g pane-base-index 1
# ウィンドウを閉じたときに番号を詰める
set -g renumber-windows on

# faster key repetition
set -s escape-time 0

set -g history-limit 30000

# OSC 52 でクリップボードに書けるようにする (SSH 先の nvim からもコピー可)。
# iTerm2 側で "Applications in terminal may access clipboard" を on にすること
set -g set-clipboard on
# ローカルの tmux から ssh すると、SSH 先には TERM=tmux-256color で入る。tmux の既定は
# xterm* にしか clipboard を付けないので、付けないと SSH 先の tmux が OSC 52 を外へ送らない
set -as terminal-features ",tmux*:clipboard"

set -g mouse on

set -g clock-mode-style 24

#################################
# KeyBindings
#################################
unbind r
bind r source-file ~/.tmux.conf\; display-message "tmux reloaded"

unbind A
bind A command-prompt "rename-window %%"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind = select-layout tiled
bind E select-layout even-horizontal
bind V select-layout even-vertical

unbind *
bind * list-clients

unbind s
bind-key s command-prompt "select-window -t '%%'"

# prefix + S: tmuxx (セッション / tmuxinator プロジェクトの fzf ランチャー) をポップアップで開く
unbind S
bind S display-popup -E -w 80% -h 70% "zsh -c 'source ~/.tmux.zsh && tmuxx'"

# copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection

## Esc キーでコピーの反転を解除し、コピーモードは抜けない
bind-key -T copy-mode-vi Escape send -X clear-selection

## Ctrl-c キーでコピーの反転を解除し、コピーモードから抜ける
bind-key -T copy-mode-vi C-c send -X cancel

bind-key -T copy-mode-vi C-v send -X rectangle-toggle

bind-key -T copy-mode-vi V send -X select-line

bind-key -T copy-mode-vi C-a send -X start-of-line
bind-key -T copy-mode-vi C-e send -X end-of-line
# top-line/bottom-line は vi の H/L 相当 (表示範囲内) なので scrollback の
# 先頭・末尾に飛べない。gg/G と同じ挙動にするには history-top/history-bottom。
bind-key -T copy-mode-vi g send -X history-top
bind-key -T copy-mode-vi G send -X history-bottom

# NOTE: / と ? は再定義しない。引数なしの search-forward は「既存の検索語の
# 繰り返し」であり、検索語を入力する手段がこのキーしかないため、上書きすると
# copy-mode の検索が永久に使えなくなる。tmux の既定が既に vi 互換
# (command-prompt 経由) なので既定に任せる。

#################################
# Copy
#################################
# OSC 52 (set-clipboard on) に任せるので pbcopy は使わない。
# こうしておくと SSH 先の tmux でコピーしてもホスト (iTerm2) のクリップボードに入る。
# 多段 (ローカル tmux -> ssh -> リモート tmux) でもローカル側の set-clipboard が中継する。
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

#################################
# tpm
#################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Claude Code をプロジェクトごとに popup で起動し、prefix + u のピッカーで状態一覧・ジャンプ (fzf, jq 依存)
#   prefix + y: カレントディレクトリの Claude を起動 / 再アタッチ
#   prefix + d: popup を閉じる (セッションは残る)
set -g @plugin 'craftzdog/tmux-claude-hatch'

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"

#################################
# Theme (Catppuccin Mocha。nvim の colorscheme と揃える)
#################################
# テーマ系プラグインは使わず自前で組む。プラグインはスタイルを上書きするので tpm の後に置く。
# アイコンは Nerd Font 前提 (iTerm2 のフォントは HackGen35 Console NF)。
set -g @thm_crust    "#11111b"
set -g @thm_mantle   "#181825"
set -g @thm_base     "#1e1e2e"
set -g @thm_surface0 "#313244"
set -g @thm_surface1 "#45475a"
set -g @thm_overlay0 "#6c7086"
set -g @thm_subtext0 "#a6adc8"
set -g @thm_text     "#cdd6f4"
set -g @thm_red      "#f38ba8"
set -g @thm_peach    "#fab387"
set -g @thm_yellow   "#f9e2af"
set -g @thm_green    "#a6e3a1"
set -g @thm_sky      "#89dceb"
set -g @thm_blue     "#89b4fa"
set -g @thm_mauve    "#cba6f7"

# アクティブなペインを明るく、非アクティブなペインを沈ませる
set -g window-style "fg=#6c7086,bg=#181825"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#a6e3a1,bold"
set -g pane-border-indicators arrows

set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#f9e2af,bg=#313244"
set -g mode-style "fg=#cdd6f4,bg=#45475a"
set -g copy-mode-match-style "fg=#11111b,bg=#f9e2af"
set -g copy-mode-current-match-style "fg=#11111b,bg=#fab387"

set -g popup-border-style "fg=#cba6f7"
set -g popup-border-lines rounded
set -g menu-style "fg=#cdd6f4,bg=#181825"
set -g menu-selected-style "fg=#11111b,bg=#cba6f7"
set -g menu-border-style "fg=#cba6f7"
set -g menu-border-lines rounded

set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#a6e3a1"
set -g clock-mode-colour "#89b4fa"

# status bar
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#cdd6f4,bg=#181825"

# 左: セッション名。prefix を押している間は赤に変わる
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,#{@thm_red},#{@thm_blue}}]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_blue}},bold] #S #[fg=#{?client_prefix,#{@thm_red},#{@thm_blue}},bg=#{@thm_mantle},nobold] "

# ウィンドウ: nord-tmux と同じ形 (三角でつなぎ、番号と名前を細い三角で区切る)。配色は Catppuccin。
# 現在のウィンドウは sky。#F はウィンドウの状態 (* 現在 / - 直前 / Z ズーム / ! ベル)。
# ベル / アクティビティ (tmux-claude-hatch の通知など) は名前を赤字にして知らせる
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@thm_mantle},bg=#{@thm_surface0}] #[fg=#{@thm_subtext0}]#I  #[fg=#{?#{||:#{window_bell_flag},#{window_activity_flag}},#{@thm_red},#{@thm_subtext0}}]#W #F #[fg=#{@thm_surface0},bg=#{@thm_mantle}]"
set -g window-status-current-format "#[fg=#{@thm_mantle},bg=#{@thm_sky}] #[fg=#{@thm_crust}]#I  #W #F #[fg=#{@thm_sky},bg=#{@thm_mantle}]"
set -g window-status-bell-style "default"
set -g window-status-activity-style "default"

# 右: カレントディレクトリ。日時は iTerm2 のステータスバーに出ているので出さない。
# ホスト名は SSH 先で起動した tmux のときだけ出す (サーバー起動時の環境で判定)
set -g status-right-length 100
set -g status-right "#[fg=#{@thm_blue}] #{b:pane_current_path} "
if-shell '[ -n "$SSH_CONNECTION" ]' "set -ga status-right ' #[fg=#{@thm_green}]󰒋 #h '"
