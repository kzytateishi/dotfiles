#################################
# Prefix
#################################
unbind C-b
set -g prefix C-a
bind C-a send-prefix

#################################
# General
#################################
set -g default-terminal tmux-256color
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on

# window title
set -g set-titles on
set -g set-titles-string "#S"
set -g allow-rename off
setw -g automatic-rename off

set -g base-index 1
set -g pane-base-index 1

# faster key repetition
set -s escape-time 0

set -g history-limit 30000

set -g mouse on

set -g clock-mode-style 24

#################################
# Theme
#################################
set-option -g status-left-length 20

# window-style は nord-tmux が触らないのでここで設定してよい
set -g window-style "fg=colour245,bg=colour234"
set -g window-active-style "fg=colour255,bg=black"
# NOTE: pane-border-style / pane-active-border-style はここで設定しても
# 末尾の tpm 実行時に nord-tmux が上書きするため、tpm の後で設定すること

#################################
# KeyBindings
#################################
unbind r
bind r source-file ~/.tmux.conf\; display-message "tmux reloaded"

unbind A
bind A command-prompt "rename-window %%"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind = select-layout tiled
bind E select-layout even-horizontal
bind V select-layout even-vertical

unbind *
bind * list-clients

unbind s
bind-key s command-prompt "select-window -t '%%'"

# copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection

## Esc キーでコピーの反転を解除し、コピーモードは抜けない
bind-key -T copy-mode-vi Escape send -X clear-selection

## Ctrl-c キーでコピーの反転を解除し、コピーモードから抜ける
bind-key -T copy-mode-vi C-c send -X cancel

bind-key -T copy-mode-vi C-v send -X rectangle-toggle

bind-key -T copy-mode-vi V send -X select-line

bind-key -T copy-mode-vi C-a send -X start-of-line
bind-key -T copy-mode-vi C-e send -X end-of-line
# top-line/bottom-line は vi の H/L 相当 (表示範囲内) なので scrollback の
# 先頭・末尾に飛べない。gg/G と同じ挙動にするには history-top/history-bottom。
bind-key -T copy-mode-vi g send -X history-top
bind-key -T copy-mode-vi G send -X history-bottom

# NOTE: / と ? は再定義しない。引数なしの search-forward は「既存の検索語の
# 繰り返し」であり、検索語を入力する手段がこのキーしかないため、上書きすると
# copy-mode の検索が永久に使えなくなる。tmux の既定が既に vi 互換
# (command-prompt 経由) なので既定に任せる。

#################################
# Copy
#################################
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

#################################
# tpm
#################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'arcticicestudio/nord-tmux'

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"

#################################
# Overrides (tpm の後でないとテーマに上書きされる)
#################################
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour46,bold"
set -g clock-mode-colour blue

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"
